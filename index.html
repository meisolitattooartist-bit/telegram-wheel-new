<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10182b"><title>گردونه قرعه‌کشی</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#0b1020;--p:#172139;--line:#33415f;--gold:#f6c85f;--txt:#f8f9fc;--muted:#b5bfd1}*{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}body{font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top,#243454,#0b1020 65%);color:var(--txt);padding:12px}main{width:min(720px,100%);margin:auto;display:grid;gap:12px}h1{text-align:center;font-size:22px;margin:5px}p.sub{text-align:center;color:var(--muted);font-size:12px;margin:0 0 5px}.panel{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}input,textarea,button{font:inherit}input,textarea{width:100%;min-width:0;background:#0d1425;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px}textarea{min-height:112px;line-height:1.7;resize:vertical}.full{grid-column:1/-1}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:12px;font-weight:bold;cursor:pointer}.primary{background:var(--gold);color:#161616;flex:1}.secondary{background:#30405f;color:white}button:disabled{opacity:.45}.small{font-size:12px;color:var(--muted);line-height:1.7}.wheelwrap{position:relative;width:min(82vw,420px);aspect-ratio:1;margin:8px auto;contain:layout paint}canvas{display:block;width:100%;height:100%;border-radius:50%;border:4px solid var(--gold);box-shadow:0 10px 28px #0008;transform-origin:50% 50%;will-change:transform}.pointer{position:absolute;z-index:2;top:-7px;left:50%;transform:translateX(-50%);border-left:15px solid transparent;border-right:15px solid transparent;border-top:29px solid white;filter:drop-shadow(0 3px 3px #0008)}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18%;aspect-ratio:1;border-radius:50%;background:white;border:5px solid var(--gold)}#status{text-align:center;min-height:28px;color:var(--gold);font-weight:bold;margin:10px 0}.result{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1425;padding:12px;border-radius:10px;line-height:1.8;min-height:45px}@media(max-width:420px){.grid{grid-template-columns:1fr}.full{grid-column:auto}body{padding:8px}}
</style></head><body><main><header><h1>🎯 گردونهٔ قرعه‌کشی</h1><p class="sub">یک اجراکننده · نمایش با اشتراک صفحهٔ ویسکال</p></header><section class="panel grid"><div><label>نام گردونه</label><input id="title" placeholder="نام قرعه‌کشی"></div><div><label>اسپانسر</label><input id="sponsor" placeholder="نام اسپانسر"></div><div><label>جایزه</label><input id="prize" placeholder="عنوان جایزه"></div><div><label>تعداد برنده‌ها</label><input id="count" type="number" min="1" max="100" value="1"></div><div class="full"><label>اسامی (هر اسم در یک خط)</label><textarea id="names" placeholder="علی&#10;سارا&#10;مریم"></textarea><div id="nameError" style="color:#e76f51;font-size:13px;margin-top:6px"></div><div class="small">هر خط یک شانس است. پس از آماده‌سازی، اسامی قفل می‌شوند.</div></div><div class="full buttons"><button id="prepare" class="secondary">آماده‌سازی اسامی</button><button id="sound" class="secondary">🔊 صدا روشن</button></div></section><section class="panel"><div class="wheelwrap"><div class="pointer"></div><canvas id="wheel" width="900" height="900"></canvas><div class="center"></div></div><div id="status">اسامی را وارد کن</div><div class="buttons"><button id="spin" class="primary" disabled>چرخاندن گردونه</button><button id="reset" class="secondary">شروع دوباره</button></div><p class="small">انتخاب برنده با مولد تصادفی رمزنگارانهٔ مرورگر انجام می‌شود؛ انیمیشن روی همان برنده متوقف می‌شود.</p></section><section class="panel"><label>نتیجه با تاریخ و ساعت</label><div id="result" class="result">هنوز نتیجه‌ای ثبت نشده.</div><div class="buttons" style="margin-top:9px"><button id="copy" class="primary">کپی نتیجه</button></div></section></main><script>
(()=>{try{Telegram?.WebApp?.ready();Telegram?.WebApp?.expand()}catch(e){}const $=x=>document.getElementById(x),cv=$('wheel'),ctx=cv.getContext('2d'),colors=['#e76f51','#2a9d8f','#e9c46a','#457b9d','#9b5de5','#f15bb5','#00bbf9','#80b918','#fb8500','#577590'];let entries=[],winners=[],prepared=false,running=false,sound=true,rotation=0;function rand(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let x;do{crypto.getRandomValues(a);x=a[0]}while(x>=lim);return x%n}function draw(){let n=Math.max(entries.length,1),cx=450,cy=450,r=430,step=2*Math.PI/n;ctx.clearRect(0,0,900,900);if(!entries.length){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#26334e';ctx.fill();ctx.fillStyle='white';ctx.font='bold 32px Tahoma';ctx.textAlign='center';ctx.fillText('اسامی شرکت‌کننده‌ها',cx,cy);return}entries.forEach((s,i)=>{let a=-Math.PI/2+i*step;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#ffffff66';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(a+step/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='white';ctx.font=`bold ${Math.max(15,Math.min(28,420/n))}px Tahoma`;ctx.shadowColor='#0008';ctx.shadowBlur=3;ctx.fillText(s.length>22?s.slice(0,21)+'…':s,r-25,0,r*1.2);ctx.restore()})}function status(s){$('status').textContent=s}function speak(s){if(!sound||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='fa-IR';u.rate=.92;speechSynthesis.speak(u)}catch(e){}}function result(){let d=new Date(),lines=[`نام گردونه: ${$('title').value.trim()||'—'}`,`اسپانسر: ${$('sponsor').value.trim()||'—'}`,`جایزه: ${$('prize').value.trim()||'—'}`,`تاریخ: ${d.toLocaleDateString('fa-IR')}`,`ساعت: ${d.toLocaleTimeString('fa-IR')}`,'','برندگان:',...winners.map((x,i)=>`${i+1}. ${x}`)];$('result').textContent=lines.join('\n')}function prepare(){let names=$('names').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),c=+$('count').value;if(running)return;names=names.filter((name,i,all)=>all.findIndex(x=>x.localeCompare(name,'fa',{sensitivity:'base'})===0)===i);$('names').value=names.join('\\n');if(names.length<2)return status('حداقل دو اسم متفاوت وارد کن');if(!Number.isInteger(c)||c<1||c>names.length)return status(`تعداد برنده باید بین ۱ تا ${names.length} باشد`);names=names.filter((n,i,a)=>a.findIndex(x=>x.normalize("NFC").toLocaleLowerCase("fa")===n.normalize("NFC").toLocaleLowerCase("fa"))===i);$("names").value=names.join(String.fromCharCode(10));entries=names;winners=[];prepared=true;$('names').readOnly=true;$('count').disabled=true;$('spin').disabled=false;draw();$('result').textContent='هنوز نتیجه‌ای ثبت نشده.';status(`${entries.length} اسم آماده است`)}function spin(){if(running||!prepared)return;let c=+$('count').value;if(winners.length>=c)return;running=true;$('spin').disabled=true;$('prepare').disabled=true;$('reset').disabled=true;let idx=rand(entries.length),name=entries[idx],step=360/entries.length,target=((360-(idx+.5)*step)%360+360)%360,cur=((rotation%360)+360)%360,delta=(target-cur+360)%360,from=rotation,to=rotation+5*360+delta,start=performance.now(),dur=4800;status('گردونه در حال چرخش است…');speak('گردونه در حال چرخش است');function frame(t){let p=Math.min(1,(t-start)/dur),e=1-Math.pow(1-p,4);rotation=from+(to-from)*e;cv.style.transform=`rotate(${rotation}deg)`;if(p<1)return requestAnimationFrame(frame);rotation=to;entries.splice(idx,1);winners.push(name);running=false;draw();result();$('prepare').disabled=false;$('reset').disabled=false;$('spin').disabled=winners.length>=c;status(`🏆 برنده: ${name}`);speak(`برنده قرعه کشی ${name} است`)}requestAnimationFrame(frame)}function reset(){if(running)return;entries=[];winners=[];prepared=false;rotation=0;$('names').readOnly=false;$('count').disabled=false;$('spin').disabled=true;$('prepare').disabled=false;$('reset').disabled=false;$('names').value='';cv.style.transform='rotate(0deg)';draw();$('result').textContent='هنوز نتیجه‌ای ثبت نشده.';status('اسامی را وارد کن')}$('names').addEventListener('input',()=>{let el=$('names'),lines=el.value.split(/\r?\n/),seen=new Set(),duplicate='';for(let i=0;i<lines.length;i++){let n=lines[i].trim(),key=n.normalize('NFC').toLocaleLowerCase('fa');if(n&&seen.has(key)){duplicate=n;lines.splice(i,1);i--;continue}if(n)seen.add(key)}if(duplicate){el.value=lines.join(String.fromCharCode(10));$('nameError').textContent='اسم «'+duplicate+'» تکراری است و حذف شد.'}else $('nameError').textContent=''});$('prepare').onclick=prepare;$('spin').onclick=spin;$('reset').onclick=reset;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 صدا روشن':'🔇 صدا خاموش';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};$('copy').onclick=async()=>{let t=$('result').textContent;try{if(navigator.clipboard?.writeText)await navigator.clipboard.writeText(t);else{let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}status('نتیجه کپی شد')}catch(e){status('کپی نشد؛ نتیجه را دستی انتخاب کن')}};draw()})();
</script></body></html>
